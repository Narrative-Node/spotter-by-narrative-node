<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Spotter by Narrative Node</title>
  <link rel="stylesheet" href="css/spotter.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="side" aria-label="Folders">
      <nav class="side-scroll" id="tree"></nav>
      <div class="side-foot">
        <div class="switch-row">
          <span id="autoplay-label">Auto-Play</span>
          <button class="switch" id="autoplay" type="button" role="switch" aria-checked="false" aria-labelledby="autoplay-label"></button>
        </div>
        <button class="btn" id="rescan" type="button">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.61-3.89M13.5 2.5v3h-3"/></svg>
          <span>Rescan folders</span>
        </button>
        <button class="upsell" id="promo" type="button" data-href="https://www.narrativenode.app/from-spotter" title="Navigator for Premiere Pro: browse and scrub your video footage">
          <span class="upsell-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><rect x="3" y="6.5" width="13.5" height="11" rx="2"/><path d="M16.5 10.5l4.5-2.5v8l-4.5-2.5"/></svg>
          </span>
          <span class="upsell-text">
            <span class="upsell-title">Try Navigator</span>
            <span class="upsell-sub">For Video Footage</span>
          </span>
          <span class="upsell-badge">50% OFF</span>
        </button>
      </div>
    </aside>

    <section class="main">
      <div class="update" id="update" role="status" hidden>
        <span class="update-text" id="update-text"></span>
        <button class="btn" id="update-get" type="button">Download</button>
        <button class="icon-btn" id="update-close" type="button" aria-label="Dismiss" title="Not now">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
        </button>
      </div>

      <header class="bar">
        <div class="heading">
          <h1 id="title">Spotter</h1>
          <span class="count" id="count"></span>
          <label class="size" title="Card size">
            <svg class="size-small" viewBox="0 0 16 16" aria-hidden="true"><rect x="5" y="5" width="6" height="6" rx="1"/></svg>
            <input id="size" type="range" min="0" max="100" step="1" value="25" aria-label="Card size">
            <svg class="size-large" viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="2.5" width="11" height="11" rx="1.5"/></svg>
          </label>
        </div>
        <label class="search">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5l3 3"/></svg>
          <input id="search" type="search" placeholder="Search" autocomplete="off" spellcheck="false" aria-label="Search sounds">
        </label>
        <div class="seg" role="group" aria-label="View">
          <button type="button" id="view-tiles" aria-pressed="false" title="Compact">
            <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="2.5" width="4.5" height="4.5" rx="1"/><rect x="9" y="2.5" width="4.5" height="4.5" rx="1"/><rect x="2.5" y="9" width="4.5" height="4.5" rx="1"/><rect x="9" y="9" width="4.5" height="4.5" rx="1"/></svg>
          </button>
          <button type="button" id="view-cards" aria-pressed="true" title="Cards">
            <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="M5 6.5v3M7 5.5v5M9 7v2M11 6v4"/></svg>
          </button>
          <button type="button" id="view-list" aria-pressed="false" title="List">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"/></svg>
          </button>
        </div>
      </header>

      <div class="results" id="results" role="listbox" aria-label="Sounds" tabindex="0">
        <div class="sizer" id="sizer"></div>
      </div>
      <div class="empty" id="empty" hidden></div>

      <p class="status" id="status" role="status" hidden></p>

      <div class="now-bar" aria-live="polite">
        <span class="now-name" id="now-name">Nothing selected</span>
        <span class="now-meta" id="now-meta"></span>
      </div>
      <footer class="player" aria-label="Player">
        <button class="play" id="play" type="button" aria-label="Play" disabled>
          <svg class="i-play" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 3.5v9l7-4.5z"/></svg>
          <svg class="i-pause" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3.5h2v9H5zM9 3.5h2v9H9z"/></svg>
        </button>
        <canvas class="player-wave" id="player-wave" aria-label="Waveform. Click to move the playhead."></canvas>
        <span class="time" id="time">0:00 / 0:00</span>
        <div class="volume">
          <button class="mute" id="mute" type="button" aria-pressed="false" title="Mute">
            <svg class="i-sound" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 6h2.5l3.5-3v10L5 10H2.5zM11 5.5a3.5 3.5 0 0 1 0 5"/></svg>
            <svg class="i-muted" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 6h2.5l3.5-3v10L5 10H2.5zM10.5 6l3.5 4M14 6l-3.5 4"/></svg>
          </button>
          <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
        </div>
      </footer>
    </section>
  </div>

  <div class="menu" id="menu" role="menu" hidden></div>
  <audio id="audio" preload="auto"></audio>

  <script src="js/core.js"></script>
  <script src="js/env-cep.js"></script>
  <script src="js/waveform.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

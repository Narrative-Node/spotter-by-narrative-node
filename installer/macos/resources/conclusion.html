<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>Spotter is installed</title>
<style>
  :root { --ink: #1d1d1f; --quiet: #5b6b6e; --badge: #2d6d75; --badge-ink: #ffffff; --rule: rgba(0,0,0,0.12); }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #f5f5f7; --quiet: #a7babd; --badge: #6fb4bb; --badge-ink: #0b1d1f; --rule: rgba(255,255,255,0.16); }
  }
  html { background: transparent; }
  body { margin: 0; padding: 4px 6px 96px; font: 13px/1.5 -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; color: var(--ink); }
  h1 { margin: 0 0 14px; font-size: 23px; line-height: 1.2; font-weight: 600; letter-spacing: -0.015em; }
  p { margin: 0 0 10px; max-width: 34em; }
  ol { margin: 0 0 18px; padding: 0; list-style: none; counter-reset: step; max-width: 34em; }
  ol li { counter-increment: step; margin: 0 0 8px; padding-left: 26px; position: relative; }
  ol li::before { content: counter(step); position: absolute; left: 0; top: 1px; width: 17px; height: 17px; border-radius: 50%; background: var(--badge); color: var(--badge-ink); font: 600 11px/17px -apple-system, sans-serif; text-align: center; }
  .quiet { color: var(--quiet); font-size: 12px; border-top: 1px solid var(--rule); padding-top: 10px; margin-top: 20px; }
  kbd, .path { font: 12px ui-monospace, "SF Mono", Menlo, monospace; }
</style>
</head>
<body>
  <h1>Spotter is installed</h1>
  <ol>
    <li>Open Premiere Pro, or restart it if it is running.</li>
    <li>Open <b>Window &rsaquo; Extensions &rsaquo; Spotter by Narrative Node</b>.</li>
  </ol>
  <p class="quiet">If Premiere Pro does not list Spotter, verify that extensions are enabled or reinstall with Premiere closed.</p>
</body>
</html>

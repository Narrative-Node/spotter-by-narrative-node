# Builds Spotter's Windows installer, Mac package and ZXP, and publishes them to a GitHub release.
#
#   git tag v1.0.1 && git push origin v1.0.1     builds, then publishes release v1.0.1 with the files
#   Actions > Release > Run workflow             builds only; the files are in the run's Artifacts
#
# The tag must match the version in extension/CSXS/manifest.xml, or the build stops.
# GitHub reads workflows from the repository root, so this works once Spotter is its own repository.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows builds the installer and the .zxp. Adobe advises signing a .zxp on the platform it
          # is for, and the Windows one is the .zxp that is published.
          - os: windows-latest
            artifact: windows
            files: |
              release/Spotter-Setup-*.exe
              release/Spotter-*.zxp
          # The Mac package holds a copy of the extension signed on the Mac. The runner is Intel because
          # Adobe's ZXPSignCmd for macOS is an Intel binary.
          - os: macos-15-intel
            artifact: macos
            files: |
              release/Spotter-*.pkg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tag matches the extension version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(sed -n 's/.*ExtensionBundleVersion="\([^"]*\)".*/\1/p' extension/CSXS/manifest.xml)
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} but extension/CSXS/manifest.xml says $v"; exit 1; }

      - run: npm test

      - name: Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y

      # Windows installer code signing (.exe). Uses WINDOWS_CERT_PFX_BASE64 and password, or WINDOWS_SIGN_ARGS.
      - name: Windows installer certificate
        if: runner.os == 'Windows'
        shell: bash
        env:
          SIGN_ARGS: ${{ secrets.WINDOWS_SIGN_ARGS || secrets.SPOTTER_WINDOWS_SIGN_ARGS }}
          PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 || secrets.SPOTTER_WINDOWS_CERT_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD || secrets.SPOTTER_WINDOWS_CERT_PASSWORD }}
          SIGN_IS_TEST: ${{ vars.SIGN_IS_TEST }}
        run: |
          if [ -n "$SIGN_ARGS" ]; then
            echo "WINDOWS_SIGN_ARGS=$SIGN_ARGS" >> "$GITHUB_ENV"
          elif [ -n "$PFX_BASE64" ]; then
            pfx="$RUNNER_TEMP/codesign.pfx"
            echo "$PFX_BASE64" | base64 -d > "$pfx"
            echo "WINDOWS_SIGN_ARGS=/f $(cygpath -w "$pfx") /p \"$PFX_PASSWORD\" /fd sha256 /tr http://timestamp.digicert.com /td sha256" >> "$GITHUB_ENV"
            if [ -z "$SIGN_IS_TEST" ]; then
              echo "SIGN_IS_TEST=1" >> "$GITHUB_ENV"
            fi
          else
            echo "::warning::No WINDOWS_CERT_PFX_BASE64 or WINDOWS_SIGN_ARGS secret: building UNSIGNED Windows installer."
          fi

      # macOS package signing and notarisation
      - name: macOS certificates and notary login
        if: runner.os == 'macOS'
        env:
          P12_BASE64: ${{ secrets.MAC_CERTS_P12_BASE64 || secrets.SPOTTER_MAC_CERTS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD || secrets.SPOTTER_MAC_CERTS_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ]; then
            echo "::warning::No MAC_CERTS_P12_BASE64 secret: building unsigned macOS package."
            exit 0
          fi
          kc="$RUNNER_TEMP/build.keychain-db"; pw=$(uuidgen)
          echo "$P12_BASE64" | base64 -d > "$RUNNER_TEMP/certs.p12"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          security import "$RUNNER_TEMP/certs.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$kc"
          security set-key-partition-list -S apple-tool:,apple: -k "$pw" "$kc" >/dev/null 2>&1 || true
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/certs.p12"

          ids=$(security find-identity -p codesigning "$kc" 2>/dev/null || true)
          pkg=$(echo "$ids" | sed -n 's/.*"\(Developer ID Installer:[^"]*\)".*/\1/p' | head -1)
          if [ -n "$pkg" ]; then
            echo "MAC_INSTALLER_IDENTITY=$pkg" >> "$GITHUB_ENV"
          fi
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPLE_APP_PASSWORD" ]; then
            xcrun notarytool store-credentials NN_NOTARY --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
            echo "MAC_NOTARY_PROFILE=NN_NOTARY" >> "$GITHUB_ENV"
          fi

      # Optional. Without these secrets every build makes a new self-signed certificate for the .zxp,
      # which is enough for Premiere to load it. With them, every release is signed by the same one.
      #   SPOTTER_P12_BASE64   a .p12 made with ZXPSignCmd -selfSignedCert, as one line of base64
      #   SPOTTER_P12_PASSWORD its password
      - name: ZXP certificate
        shell: bash
        env:
          P12_BASE64: ${{ secrets.SPOTTER_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.SPOTTER_P12_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ]; then echo "No SPOTTER_P12_BASE64 secret: using a fresh self-signed certificate."; exit 0; fi
          p12="$RUNNER_TEMP/spotter.p12"
          echo "$P12_BASE64" | base64 -d > "$p12"
          echo "SPOTTER_P12=$p12" >> "$GITHUB_ENV"
          echo "SPOTTER_P12_PASSWORD=$P12_PASSWORD" >> "$GITHUB_ENV"

      - run: node installer/build.mjs

      - name: Remove the certificates
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/spotter.p12" "$RUNNER_TEMP/codesign.pfx" "$RUNNER_TEMP/certs.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          # A tag with a hyphen (v1.1.0-beta.1) is published as a pre-release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            Free Premiere Pro panel for browsing your music and sound-effect folders.

            **Install:** close Premiere Pro, run the installer for your computer, then open Window › Extensions › Spotter by Narrative Node.

            - `Spotter-Setup-*.exe`: Windows 10 and 11 (64-bit). If Windows shows "Windows protected your PC", choose More info › Run anyway.
            - `Spotter-*.pkg`: macOS, Intel and Apple silicon. If macOS can't verify it, right-click the file and choose Open.
            - `Spotter-*.zxp`: for ZXP installers such as ZXPInstaller or Anastasiy's Extension Manager.

            Checksums are in `SHA256SUMS.txt`.
          files: dist/*

# Builds Spotter's installers on GitHub's runners, and on a version tag drafts a release.
# Active once Spotter is its own repository (GitHub reads workflows from the repository root).
name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y
      # Each platform signs its own .zxp, as Adobe advises.
      - run: node installer/build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}
          path: |
            release/Spotter-Setup-*.exe
            release/Spotter-*.pkg
            release/Spotter-*.zxp
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Windows
          path: dist/windows
      - uses: actions/download-artifact@v4
        with:
          name: macOS
          path: dist/macos
      # The Windows-signed .zxp is the one published; the Mac one ships inside the .pkg.
      - name: Collect
        run: |
          mkdir out
          cp dist/windows/*.exe dist/windows/*.zxp dist/macos/*.pkg out/
          cd out && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: out/*
